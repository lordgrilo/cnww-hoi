project:
  type: book
  output-dir: docs

book:
  title: "Multivariate Information Theory"
  subtitle: "A Practical Tutorial with HOI, Frites, and XGI"
  author: "Giovanni Petri"
  date: today
  repo-url: https://github.com/yourusername/multivariate-information-theory-tutorial
  repo-actions: [edit, issue]
  downloads: [pdf]
  sharing: [twitter, linkedin]
  
  chapters:
    - index.md
    
    - part: "Part I: Foundations"
      chapters:
        - 01_information_theory_foundations.ipynb
        - 02_xor_problem_synergy.ipynb
    
    - part: "Part II: Advanced Tools"
      chapters:
        - 03_hoi_higher_order_interactions.ipynb
        - 04_frites_neural_timeseries.ipynb
        - 05_xgi_hypergraph_networks.ipynb
    
    - part: "Part III: Integration"
      chapters:
        - 06_complete_integration.ipynb
    
    - references.md

  appendices:
    - installation_guide.md

bibliography: references.bib
csl: nature-neuroscience.csl


format:
  html:
    theme: 
      light: cosmo
      dark: darkly
    css: styles.css
    code-copy: true
    code-fold: show
    code-tools: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    link-external-icon: true
    link-external-newwindow: true
    smooth-scroll: true
    highlight-style: github
    fig-width: 8
    fig-height: 6
    fig-responsive: true
    
  pdf:
    documentclass: book
    classoption: [oneside, openany]
    papersize: letter
    fontsize: 11pt
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    colorlinks: true
    linkcolor: blue
    urlcolor: blue
    citecolor: blue
    keep-tex: true
    fig-pos: 'htbp'
    fig-width: 6.5
    fig-height: 4.5
    include-in-header:
      text: |
        \usepackage{amsmath}
        \usepackage{amssymb}
        \usepackage{mathtools}
        \usepackage{physics}

execute:
  freeze: auto  # Only re-run changed notebooks
  cache: true
  warning: false
  message: false
  echo: true
  eval: true

jupyter: python3

# Code execution options
engine: jupyter

# Computational options
knitr:
  opts_chunk:
    fig.align: center
    out.width: "80%"
